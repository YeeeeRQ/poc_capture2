[package]
name = "capture"
version = "0.1.0"
edition = "2021"

[dependencies]
xcap = "0.2"
clap = { version = "4", features = ["derive"] }
image = "0.25"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
ctrlc = "3"

[features]
default = ["record"]
record = []

[profile.release]
opt-level = 3
lto = true
strip = true
