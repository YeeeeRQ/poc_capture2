[package]
name = "capture-core"
version = "0.1.0"
edition = "2021"

[dependencies]
windows-capture = { git = "https://github.com/YeeeeRQ/windows-capture" }
image = "0.25"
anyhow = "1"
chrono = "0.4"
log = "0.4"
parking_lot = "0.12"
crossbeam = "0.8"
ctrlc = { version = "3", optional = true }
windows = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[features]
default = ["record"]
record = ["ctrlc"]
